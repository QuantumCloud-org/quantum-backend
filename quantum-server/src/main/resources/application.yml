# 服务器配置
server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 200
      min-spare: 10
spring:
  application:
    name: quantum-backend
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # multipart 必须挂在 spring.servlet 下，挂在 server.servlet 下不会生效（默认 1MB 会拦掉上传）
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
  autoconfigure:
    exclude:
      - org.springframework.boot.devtools.autoconfigure.DevToolsDataSourceAutoConfiguration
      # cache.mode=local 时禁用 Redisson 自动装配，避免启动时连接不存在的 Redis
      # 切换为 redis 模式时删除以下两行，并在对应 profile 配置 spring.data.redis.*
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

file:
  # 文件存储配置 local / rustfs
  storage-type: local
  local:
    base-path: /opt/application/files
    domain: http://localhost:8080/api/file
  rustfs:
    endpoint: http://localhost:9000
    access-key: ${RUSTFS_ACCESS_KEY:}
    secret-key: ${RUSTFS_SECRET_KEY:}
    bucket: quantum
    region: cn-north-1
    path-style-access: true

# 缓存模式配置
# redis（默认）：L1 Caffeine + L2 Redis 双级缓存，需配置 spring.data.redis.*
# local：纯 Caffeine 内存缓存，无需 Redis，适用于本地开发/测试环境
cache:
  mode: local

# Security 配置
security:
  cors-allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
  refresh-cookie-secure: false
  xss-enabled: true
  # 允许传 HTML 的富文本字段接口
  #xss-excludes:
  #  - /notice/content
  # 白名单路径
  whitelist:
    - /auth/login
    - /auth/captcha
  # 密码
  password-min-length: 8
  password-max-length: 20
  # 登录失败
  max-login-fail-count: 10
  # 登录失败锁定时间（分钟）
  lock-time: 10
  # Token 配置
  # secret 不在基线配置中提供默认值：dev 由 application-dev.yml 提供，
  # prod 必须通过环境变量 SECURITY_TOKEN_SECRET 注入（HS512 至少 64 字符），缺失时启动失败
  token:
    # Access Token 30 分钟，过期后由 RefreshToken（HttpOnly Cookie）自动旋转续期
    access-token-expire: 30
    # Refresh Token 7 天
    refresh-token-expire: 10080
    single-device: false
